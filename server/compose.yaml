services:
  db:
    image: mysql:8
    restart: always
    ports:
      - 3306:3306
    environment:
      MYSQL_DATABASE: ds
      MYSQL_USER: pathway
      MYSQL_PASSWORD: pathway_dev_pw
      MYSQL_ROOT_PASSWORD: pathway_root_pw
    volumes:
      - ds_mysql_data:/var/lib/mysql

volumes:
  ds_mysql_data:
